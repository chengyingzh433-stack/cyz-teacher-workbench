appId: com.cyz.teacher-workbench
productName: cyz的教师工作台
directories:
  buildResources: build
  output: release
files:
  - 'out/**/*'
  - 'package.json'
  - '!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}'
  - '!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}'
extraResources:
  - from: resources
    to: resources
asar: true
asarUnpack:
  - 'node_modules/mathml2omml/**/*'
mac:
  category: public.app-category.education
  icon: build/icon.icns
  identity: null
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: cyz的教师工作台
  uninstallDisplayName: cyz的教师工作台
  installerLanguages:
    - zh_CN
  language: '2052'
  artifactName: cyz-teacher-workbench-${version}-win-${arch}-setup.${ext}
dmg:
  title: cyz的教师工作台
electronDownload:
  mirror: https://cdn.npmmirror.com/binaries/electron/
  customDir: '{{ version }}'
npmRebuild: false
